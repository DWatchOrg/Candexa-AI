<!DOCTYPE html>
<html>
<head>


<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/support.js"></script>
</head>
<body>
<x-dc>
<div data-reveal="scale" style="border-radius:28px;background:#FFFFFF;box-shadow:0 0 0 1px rgba(32,25,29,.06),0 30px 60px -36px rgba(32,25,29,.35);padding:clamp(18px,2.2vw,28px);display:flex;flex-direction:column;gap:14px;font-family:'DM Sans',system-ui,sans-serif;color:#20191D">
  <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px">
    <span style="display:flex;flex-direction:column"><span style="font-size:12px;font-weight:600;letter-spacing:.08em;color:#5E5358">YOUR AI BLUEPRINT</span><span style="font-size:17px;font-weight:600">Best model per task, from your stack</span></span>
    <span style="display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:#E9F7EF;color:#1E7A48;font-size:12px;font-weight:600"><span style="width:7px;height:7px;border-radius:50%;background:#2FB36B;animation:cxpulse 1.6s infinite"></span>Routing rules synced</span>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:6px;padding:5px;border-radius:999px;background:#F6EEE8">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
      <button onClick="{{ t.pick }}" style="flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 14px;border:0;border-radius:999px;background:{{ t.bg }};color:{{ t.fg }};font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:background .25s,color .25s">
        <img src="{{ t.icon }}" alt="" style="width:16px;height:16px;filter:{{ t.filter }}">{{ t.label }}
      </button>
    </sc-for>
  </div>
  <span style="font-size:13px;color:#5E5358">{{ note }}</span>
  <sc-for list="{{ rows }}" as="r" hint-placeholder-count="4">
    <div style="display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:16px;background:#FFFFFF;box-shadow:0 0 0 1px rgba(32,25,29,.07)">
      <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px">
        <span style="display:flex;flex-direction:column;min-width:0"><span style="font-size:15px;font-weight:600">{{ r.task }}</span><span style="font-size:12px;color:#5E5358">{{ r.team }}</span></span>
        <span style="display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:#FFF0E5;color:#9A410B;font-size:12px;font-weight:600"><span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace">→</span>{{ r.pickName }} · {{ r.pickScore }}</span>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        <sc-for list="{{ r.opts }}" as="o" hint-placeholder-count="3">
          <span style="display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:10px;background:{{ o.bg }};color:{{ o.fg }};box-shadow:{{ o.ring }};font-size:12px;font-weight:{{ o.weight }};transition:all .3s">{{ o.name }}<span style="opacity:.75">{{ o.score }}</span></span>
        </sc-for>
      </div>
    </div>
  </sc-for>
  <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;border-radius:14px;background:#20191D;color:#FEF9F5;font-size:13px"><span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#FFB98A">auto-route</span><span>{{ rule }}</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:620,&quot;height&quot;:640}}">
class Component extends DCLogic {
  state = { p: 0 };
  data = [
    { label: 'Claude', icon: '/assets/ic-claude.svg', models: ['Claude Opus 4.5', 'Claude Sonnet 4.5', 'Claude Haiku 4.5'],
      rows: [['Contract review', 'Legal', [94, 90, 78]], ['Code review', 'Engineering', [93, 95, 82]], ['Candidate screening', 'People', [88, 89, 91]], ['Market research', 'Growth', [92, 87, 80]]] },
    { label: 'GPT', icon: '/assets/ic-openai.svg', models: ['GPT-5.5', 'GPT-5 mini', 'GPT-5 nano'],
      rows: [['Contract review', 'Legal', [91, 84, 72]], ['Code review', 'Engineering', [94, 88, 76]], ['Candidate screening', 'People', [87, 90, 86]], ['Financial modelling', 'Finance', [95, 86, 74]]] },
    { label: 'Gemini', icon: '/assets/ic-googlegemini.svg', models: ['Gemini 3 Pro', 'Gemini 3 Flash', 'Gemini Flash-Lite'],
      rows: [['Contract review', 'Legal', [90, 85, 76]], ['Market research', 'Growth', [96, 90, 82]], ['Candidate screening', 'People', [86, 92, 88]], ['Financial modelling', 'Finance', [91, 87, 75]]] },
    { label: 'Other models', icon: '/assets/ic-deepseek.svg', models: ['DeepSeek V3', 'Llama 4', 'Mistral Large'],
      rows: [['Code review', 'Engineering', [92, 85, 84]], ['Candidate screening', 'People', [84, 88, 86]], ['Market research', 'Growth', [86, 83, 89]], ['Financial modelling', 'Finance', [89, 82, 85]]] }
  ];
  renderVals() {
    const p = this.state.p, d = this.data[p];
    const tabs = this.data.map((t, i) => ({ label: t.label, icon: t.icon, pick: () => this.setState({ p: i }), bg: i === p ? '#20191D' : 'transparent', fg: i === p ? '#FFFFFF' : '#3A3035', filter: i === p ? 'invert(1)' : 'none' }));
    const rows = d.rows.map(([task, team, sc]) => {
      const best = sc.indexOf(Math.max(...sc));
      return { task, team, pickName: d.models[best], pickScore: sc[best],
        opts: d.models.map((m, k) => ({ name: m, score: sc[k], bg: k === best ? '#C3540F' : '#F6EEE8', fg: k === best ? '#FFFFFF' : '#5E5358', ring: k === best ? '0 6px 14px -6px rgba(195,84,15,.6)' : 'none', weight: k === best ? 600 : 500 })) };
    });
    const rule = rows.slice(0, 3).map(r => r.task + ' → ' + r.pickName).join('  ·  ');
    const note = p === 3 ? 'Using open or specialist models? We benchmark DeepSeek, Llama, Mistral and more, side by side.' : 'Only using ' + d.label + '? We test every ' + d.label + ' model you have access to and pick the best one for each task.';
    return { tabs, rows, rule, note };
  }
}
</script>
</body>
</html>
