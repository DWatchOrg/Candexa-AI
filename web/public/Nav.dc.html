<!DOCTYPE html>
<html>
<head>


<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/support.js"></script>
</head>
<body>
<x-dc>
<div style="position:sticky;top:0;z-index:100;background:{{ bg }};backdrop-filter:saturate(1.8) blur(20px);-webkit-backdrop-filter:saturate(1.8) blur(20px);border-bottom:1px solid {{ line }};transition:background .3s,border-color .3s">
  <header style="max-width:1280px;margin:0 auto;height:64px;padding:0 24px;display:flex;align-items:center;gap:32px">
    <a href="/" aria-label="Candexa AI home" style="display:flex;align-items:center;flex:none"><img src="/assets/candexa-logo.png" alt="Candexa AI" style="height:26px;width:auto;display:block"></a>
    <sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
      <nav style="display:flex;align-items:center;gap:4px;margin:0 auto">
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="4">
          <a href="{{ l.href }}" style="padding:8px 14px;border-radius:999px;font-size:14px;font-weight:500;text-decoration:none;color:{{ l.color }};background:{{ l.bg }}" style-hover="color:#20191D;background:rgba(32,25,29,.05)">{{ l.label }}</a>
        </sc-for>
      </nav>
      <div style="display:flex;align-items:center;gap:8px;flex:none">
        <a href="#" style="padding:8px 12px;font-size:14px;font-weight:500;color:#20191D;text-decoration:none" style-hover="color:#C3540F">Sign in</a>
        <a href="/join?waitlist" style="padding:9px 16px;font-size:14px;font-weight:500;color:#20191D;text-decoration:none;border-radius:999px;box-shadow:inset 0 0 0 1px rgba(32,25,29,.18)" style-hover="color:#20191D;box-shadow:inset 0 0 0 1px #20191D">Join the waitlist</a>
        <a href="/join" style="padding:9px 16px;font-size:14px;font-weight:500;color:#FFFFFF;text-decoration:none;border-radius:999px;background:#C3540F" style-hover="color:#FFFFFF;background:#A8470B">Book a demo</a>
      </div>
    </sc-if>
    <sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ toggle }}" aria-label="Menu" style="all:unset;cursor:pointer;margin-left:auto;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;font-size:20px;color:#20191D">{{ icon }}</button>
    </sc-if>
  </header>
  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <div style="padding:8px 24px 28px;display:flex;flex-direction:column;background:#FEF9F5;border-top:1px solid rgba(32,25,29,.08)">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="4">
        <a href="{{ l.href }}" style="padding:16px 0;font-family:'Source Serif 4',Georgia,serif;font-weight:700;font-size:24px;color:#20191D;text-decoration:none;border-bottom:1px solid rgba(32,25,29,.08)">{{ l.label }}</a>
      </sc-for>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px">
        <a href="/join?waitlist" style="text-align:center;padding:14px;border-radius:999px;font-weight:500;color:#20191D;text-decoration:none;box-shadow:inset 0 0 0 1px rgba(32,25,29,.2)">Join the waitlist</a>
        <a href="/join" style="text-align:center;padding:14px;border-radius:999px;font-weight:500;color:#FFFFFF;text-decoration:none;background:#C3540F">Book a demo</a>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1280px&quot;,&quot;height&quot;:&quot;360px&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;product&quot;,&quot;why&quot;,&quot;pricing&quot;,&quot;join&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1280, open: false, scrolled: false };
  componentDidMount() {
    this.r = () => this.setState({ w: window.innerWidth });
    this.s = () => { const v = window.scrollY > 8; if (v !== this.state.scrolled) this.setState({ scrolled: v }); };
    window.addEventListener('resize', this.r); window.addEventListener('scroll', this.s, { passive: true }); this.s();
  }
  componentWillUnmount() { window.removeEventListener('resize', this.r); window.removeEventListener('scroll', this.s); }
  renderVals() {
    const a = this.props.active || 'home';
    const desktop = this.state.w >= 980;
    const links = [['product', 'Platform', '/product'], ['how', 'How it works', '/product#how'], ['why', 'Why Candexa', '/why'], ['pricing', 'Pricing', '/pricing']]
      .map(([k, label, href]) => ({ label, href, color: a === k ? '#20191D' : '#5E5358', bg: a === k ? 'rgba(32,25,29,.06)' : 'transparent' }));
    const solid = this.state.scrolled || this.state.open;
    return {
      desktop, mobile: !desktop, open: !desktop && this.state.open, icon: this.state.open ? '✕' : '☰', links,
      toggle: () => this.setState(s => ({ open: !s.open })),
      bg: solid ? 'rgba(254,249,245,.85)' : 'rgba(254,249,245,0)', line: solid ? 'rgba(32,25,29,.08)' : 'rgba(32,25,29,0)',
    };
  }
}
</script>
</body>
</html>
